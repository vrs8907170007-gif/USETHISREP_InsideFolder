[build]
  publish = "."
  functions = "netlify/functions"
  # 1) Rebuild book content from catalog.json  2) Copy e-books into Netlify's private blob storage (file-based uploads).
  command = "python3 netlify/build_books.py && mkdir -p .netlify/blobs/deploy/ebooks && (cp private/ebooks/*.epub private/ebooks/*.pdf .netlify/blobs/deploy/ebooks/ 2>/dev/null || true) && ls .netlify/blobs/deploy/ebooks"

[functions]
  node_bundler = "esbuild"

# Never serve private or server files publicly
[[redirects]]
  from = "/private/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
