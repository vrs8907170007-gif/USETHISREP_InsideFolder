<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Checkout — Vishal Singh Books</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="css/base.css">
<style>
  :root{ --accent: var(--violet); --accent-glow: var(--violet-glow); }
  .co-hero{ padding: 56px 0 30px; border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
  .co-hero .glow{ width:520px; height:520px; background: var(--violet); top:-300px; right:-120px; opacity:.4; }
  .co-hero h1{ font-size: clamp(34px, 4.6vw, 54px); margin-top: 12px; }
  .co-grid{ display:grid; grid-template-columns: 1fr 400px; gap: 40px; align-items:start; }
  @media (max-width: 920px){ .co-grid{ grid-template-columns: 1fr; } }
  .co-box{ border:1px solid var(--line); border-radius: 16px; background: var(--stage-2); padding: 26px; }
  .co-box h2{ font-size: 22px; margin-bottom: 18px; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px){ .row2{ grid-template-columns: 1fr; } }
  .line{ display:grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items:center; padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .line:first-child{ border-top:0; padding-top:0; }
  .line .th img, .line .th .type-cover{ width:56px; aspect-ratio: 2/3; height:auto; border-radius:4px; object-fit:cover; padding:4px; }
  .line .th .type-cover .tc-top, .line .th .type-cover .tc-rule, .line .th .type-cover .tc-vol{ display:none; }
  .line .th .type-cover .tc-title{ font-size:8px; }
  .line b{ display:block; font-size:14px; line-height:1.3; }
  .line small{ color: var(--ivory-dim); font-size: 12px; }
  .line .qty{ display:inline-flex; align-items:center; gap:8px; margin-top:6px; }
  .line .qty button{ width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:none; color:var(--ivory); cursor:pointer; }
  .line .rm{ background:none; border:0; color: var(--ivory-dim); font-size:12px; cursor:pointer; text-decoration:underline; margin-left:10px; }
  .sum{ display:flex; justify-content:space-between; font-size:14px; padding: 6px 0; color: var(--ivory-dim); }
  .sum.total{ font-size: 18px; color: var(--ivory); font-weight:700; border-top:1px solid var(--line); margin-top:8px; padding-top:14px; }
  .safe{ display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color: var(--ivory-dim); margin-top: 16px; }
  .safe svg{ flex-shrink:0; color: var(--emerald); }
  .pay-btn{ width:100%; justify-content:center; margin-top: 18px; font-size: 15px; padding: 16px; }
  .empty-cart{ text-align:center; padding: 40px 0; color: var(--ivory-dim); }
  .vs-field select{ appearance:auto; }
  .agree{ display:flex; gap:10px; font-size:12.5px; color: var(--ivory-dim); margin-top: 14px; align-items:flex-start; }
  .agree a{ color: var(--violet); }
</style>
</head>
<body>

<section class="co-hero">
  <div class="glow"></div>
  <div class="shell">
    <div class="eyebrow">Bookstore</div>
    <h1>Checkout</h1>
  </div>
</section>

<section class="section" style="padding-top:48px;">
  <div class="shell">
    <div id="intlNote" class="notice info" style="display:none; margin:0 0 24px;"></div>
    <div class="co-grid">
      <form id="coForm" novalidate>
        <div class="co-box">
          <h2>Your details</h2>
          <div class="vs-field"><label for="cName">Full name</label><input id="cName" autocomplete="name" placeholder="As you'd like it on the order"></div>
          <div class="row2">
            <div class="vs-field"><label for="cEmail">Email</label><input id="cEmail" type="email" autocomplete="email" placeholder="Receipt &amp; e-book links go here"></div>
            <div class="vs-field"><label for="cPhone">Mobile</label><input id="cPhone" type="tel" autocomplete="tel" placeholder="10-digit mobile"></div>
          </div>
        </div>
        <div class="co-box" id="addrBox" style="margin-top:22px;">
          <h2>Delivery address <span style="font-family:var(--font-body); font-size:12px; color:var(--ivory-dim); font-weight:600;">· India only</span></h2>
          <div class="vs-field"><label for="aLine1">House / flat, street</label><input id="aLine1" autocomplete="address-line1"></div>
          <div class="vs-field"><label for="aLine2">Area, landmark (optional)</label><input id="aLine2" autocomplete="address-line2"></div>
          <div class="row2">
            <div class="vs-field"><label for="aCity">City</label><input id="aCity" autocomplete="address-level2"></div>
            <div class="vs-field"><label for="aPin">PIN code</label><input id="aPin" inputmode="numeric" maxlength="6" autocomplete="postal-code"></div>
          </div>
          <div class="vs-field"><label for="aState">State / UT</label><select id="aState" autocomplete="address-level1"><option value="">Select…</option></select></div>
        </div>
        <input class="hp-field" id="coHoney" tabindex="-1" autocomplete="off" aria-hidden="true">
      </form>

      <aside class="co-box" id="summary">
        <h2>Your order</h2>
        <div id="lines"></div>
        <div id="sums"></div>
        <label class="agree"><input type="checkbox" id="agree"> <span>I agree to the <a href="terms.html" target="_blank">Terms</a>, <a href="refund-policy.html" target="_blank">Refund policy</a> and <a href="shipping-policy.html" target="_blank">Shipping policy</a>.</span></label>
        <button class="btn btn-accent pay-btn" id="payBtn" type="button">Pay securely</button>
        <div id="coResult" class="notice" style="display:none;"></div>
        <div class="safe"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg><span>Payments are processed by <b>Razorpay</b> (UPI, cards, net banking, wallets). Your card or UPI details never touch this website, and every payment is verified with Razorpay before your order is confirmed.</span></div>
      </aside>
    </div>
  </div>
</section>

<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/catalog-data.js"></script>
<script src="js/shop.js"></script>
<script src="js/shell.js"></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id), esc = SHOP.esc;
  const STATES = ["Andaman and Nicobar Islands","Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chandigarh","Chhattisgarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Goa","Gujarat","Haryana","Himachal Pradesh","Jammu and Kashmir","Jharkhand","Karnataka","Kerala","Ladakh","Lakshadweep","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Puducherry","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal"];
  $('aState').innerHTML += STATES.map(s => `<option>${s}</option>`).join('');
  try { const a = JSON.parse(localStorage.getItem('vs_addr') || '{}'); ['aLine1','aLine2','aCity','aPin','aState'].forEach(k => { if (a[k]) $(k).value = a[k]; }); } catch (e) {}
  VS.prefill({ name: $('cName'), email: $('cEmail'), phone: $('cPhone') });
  let cat, busy = false;

  if (SHOP.region() === 'INTL') {
    const n = $('intlNote'); n.style.display = 'block';
    n.innerHTML = 'Buying from outside India? This checkout is for Indian addresses and rupee payments. <a href="bookstore.html" style="color:var(--gold); font-weight:700;">Buy on Amazon instead →</a> &nbsp;·&nbsp; <a href="#" id="imIndia" style="color:var(--violet);">I\'m in India</a>';
    n.querySelector('#imIndia').addEventListener('click', (e) => { e.preventDefault(); SHOP.setRegion('IN'); n.style.display = 'none'; });
  }

  function render(){
    if (!cat.shopOpen) { document.querySelector('.co-grid').innerHTML = '<div class="co-box" style="grid-column:1/-1; text-align:center;"><h2>Buying on this website opens soon</h2><p style="color:var(--ivory-dim); margin-top:10px;">All published books are available now on Amazon.</p><p style="margin-top:18px;"><a class="btn btn-accent" href="bookstore.html">Go to the Bookstore</a></p></div>'; return; }
    const lines = SHOP.lines(cat), t = SHOP.totals(cat, lines);
    if (!lines.length) {
      $('lines').innerHTML = '<div class="empty-cart">Your cart is empty.<br><br><a class="btn btn-accent" href="bookstore.html">Browse the books</a></div>';
      $('sums').innerHTML = ''; $('payBtn').style.display = 'none'; $('agree').parentElement.style.display = 'none'; $('addrBox').style.display = 'none';
      return;
    }
    $('payBtn').style.display = ''; $('agree').parentElement.style.display = '';
    $('lines').innerHTML = lines.map(l => `<div class="line" data-id="${l.id}" data-f="${l.format}">
      <div class="th">${SHOP.cover(SHOP.book(cat, l.id), '', l.format)}</div>
      <div><b>${esc(l.title)}</b><small>${esc(l.label)} · ${l.availability === 'preorder' ? (l.format === 'ebook' ? 'Pre-order — download link at launch' : 'Pre-order — ships at launch') : (l.format === 'ebook' ? 'Instant download' : 'Ships in 3–7 days')}</small>
        <div class="qty">${l.format !== 'ebook' ? `<button type="button" data-q="-1" aria-label="One less">−</button><span>${l.qty}</span><button type="button" data-q="1" aria-label="One more">+</button>` : '<small>1 licence</small>'}<button type="button" class="rm">Remove</button></div></div>
      <div>${SHOP.inr(l.line)}</div></div>`).join('');
    const sh = cat.shipping;
    $('sums').innerHTML = `<div class="sum"><span>Subtotal</span><span>${SHOP.inr(t.subtotal)}</span></div>
      ${t.hasPrint ? `<div class="sum"><span>Shipping${t.shipping ? ` <small>(free above ${SHOP.inr(sh.freeAbove)})</small>` : ''}</span><span>${t.shipping ? SHOP.inr(t.shipping) : 'Free'}</span></div>` : ''}
      <div class="sum total"><span>Total</span><span>${SHOP.inr(t.total)}</span></div>`;
    $('addrBox').style.display = t.hasPrint ? '' : 'none';
    $('payBtn').textContent = 'Pay ' + SHOP.inr(t.total) + ' securely';
  }
  $('lines').addEventListener('click', e => {
    const row = e.target.closest('.line'); if (!row) return;
    if (e.target.closest('.rm')) { SHOP.remove(row.dataset.id, row.dataset.f); render(); return; }
    const q = e.target.closest('[data-q]'); if (!q) return;
    const cur = SHOP.cart().find(x => x.id === row.dataset.id && x.format === row.dataset.f);
    SHOP.setQty(row.dataset.id, row.dataset.f, (cur ? cur.qty : 1) + Number(q.dataset.q)); render();
  });

  const showErr = (msg) => { const b = $('coResult'); b.style.display = 'block'; b.className = 'notice err'; b.innerHTML = msg; b.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
  let rzpP = null;
  const loadRzp = () => rzpP || (rzpP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://checkout.razorpay.com/v1/checkout.js'; s.onload = res; s.onerror = () => { rzpP = null; rej(new Error('load')); }; document.head.appendChild(s); }));

  $('payBtn').addEventListener('click', async () => {
    if (busy) return;
    const lines = SHOP.lines(cat), t = SHOP.totals(cat, lines);
    const rules = [{ el: $('cName'), req: true, label: 'Your name' }, { el: $('cEmail'), req: true, type: 'email', label: 'Email' }, { el: $('cPhone'), req: true, type: 'phone', label: 'Mobile' }];
    if (t.hasPrint) rules.push({ el: $('aLine1'), req: true, label: 'Address' }, { el: $('aCity'), req: true, label: 'City' }, { el: $('aPin'), req: true, label: 'PIN code' }, { el: $('aState'), req: true, label: 'State' });
    let err = VS.validate(rules);
    if (!err && t.hasPrint && !/^[1-9]\d{5}$/.test($('aPin').value.trim())) { err = 'Please enter a valid 6-digit PIN code.'; $('aPin').classList.add('is-invalid'); }
    if (!err && !$('agree').checked) err = 'Please tick the box to agree to the terms and policies.';
    if (err) return showErr(esc(err));
    $('coResult').style.display = 'none';
    const customer = { name: $('cName').value.trim(), email: $('cEmail').value.trim(), phone: $('cPhone').value.trim() };
    const address = t.hasPrint ? { line1: $('aLine1').value.trim(), line2: $('aLine2').value.trim(), city: $('aCity').value.trim(), pincode: $('aPin').value.trim(), state: $('aState').value } : null;
    VS.store.set('name', customer.name); VS.store.set('email', customer.email); VS.store.set('phone', customer.phone);
    if (address) try { localStorage.setItem('vs_addr', JSON.stringify({ aLine1: address.line1, aLine2: address.line2, aCity: address.city, aPin: address.pincode, aState: address.state })); } catch (e) {}
    busy = true; const btn = $('payBtn'); const label = btn.textContent; btn.disabled = true; btn.textContent = 'Opening secure payment…';
    const done = () => { busy = false; btn.disabled = false; btn.textContent = label; };
    let ord;
    try {
      const r = await fetch('/api/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: SHOP.cart(), customer, address, website: $('coHoney').value }) });
      const j = await r.json().catch(() => ({}));
      if (j.error === 'not-configured' || (!r.ok && !j.error)) { done(); return fallback(customer, address, lines, t); } // shop server not deployed/configured yet
      if (!r.ok) { done(); return showErr(esc(j.message || 'Something went wrong. Please try again.')); }
      ord = j;
    } catch (e) { done(); return fallback(customer, address, lines, t); }
    try { await loadRzp(); } catch (e) { done(); return showErr('Couldn\'t load the secure payment window. Check your connection (or turn off any ad-blocker) and try again.'); }
    const rzp = new window.Razorpay({
      key: ord.keyId, order_id: ord.razorpayOrderId, amount: ord.amount, currency: 'INR',
      name: 'Vishal Singh', description: 'Books — order ' + ord.orderId, image: location.origin + '/assets/logo-square.png',
      prefill: { name: customer.name, email: customer.email, contact: customer.phone },
      notes: { order: ord.orderId }, theme: { color: '#7A4FE0' },
      modal: { ondismiss: () => { done(); showErr('Payment cancelled — nothing was charged. You can try again whenever you\'re ready.'); } },
      handler: async (resp) => {
        btn.textContent = 'Confirming payment…';
        try {
          const v = await fetch('/api/verify-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ orderId: ord.orderId, key: ord.key }, resp)) });
          const vj = await v.json().catch(() => ({}));
          if (!v.ok) { done(); return showErr(esc(vj.message || 'We couldn\'t confirm the payment.') + ` Your order number is <span class="ref-code">${esc(ord.orderId)}</span>. <a href="${VS.waLink('Hi, I paid for book order ' + ord.orderId + ' — please check.')}" target="_blank" rel="noopener" style="color:var(--gold);">WhatsApp us</a>.`); }
          VS.submitRequest('payment', { name: customer.name, email: customer.email, phone: customer.phone, order: ord.orderId, total: SHOP.inr(ord.total), items: ord.lines.map(l => l.qty + ' × ' + l.title + ' (' + l.formatLabel + ')').join('; '), address: address ? [address.line1, address.line2, address.city, address.state, address.pincode].filter(Boolean).join(', ') : 'E-book only', payment_id: resp.razorpay_payment_id }, { noStore: true, subject: 'PAID book order ' + ord.orderId + ' — ' + SHOP.inr(ord.total) });
          SHOP.clear();
          location.href = 'order.html?id=' + encodeURIComponent(ord.orderId) + '&k=' + encodeURIComponent(ord.key) + '&new=1';
        } catch (e) { done(); showErr(`Payment received but confirmation is taking a moment. Please don\'t pay again — open <a style="color:var(--gold)" href="order.html?id=${encodeURIComponent(ord.orderId)}&k=${encodeURIComponent(ord.key)}">your order page</a> in a minute.`); }
      }
    });
    rzp.on('payment.failed', (r) => { showErr('Payment failed: ' + esc((r.error && r.error.description) || 'please try another method') + '. Nothing was charged.'); });
    rzp.open();
  });

  // Before Razorpay is switched on: take the order as a request and send a payment link.
  async function fallback(customer, address, lines, t){
    const f = { name: customer.name, email: customer.email, phone: customer.phone, items: lines.map(l => l.qty + ' × ' + l.title + ' (' + l.label + ')').join('; '), total: SHOP.inr(t.total), address: address ? [address.line1, address.line2, address.city, address.state, address.pincode].filter(Boolean).join(', ') : 'E-book only', _honey: $('coHoney').value };
    const box = $('coResult');
    const res = await VS.busy($('payBtn'), 'Sending order…', () => VS.submitRequest('prebook', f, { prefix: 'BK', subject: 'Book order request — ' + f.total, autoresponse: 'Thank you for your book order (' + f.items + ', total ' + f.total + '). We\'ll email you a secure payment link shortly. — Vishal Singh' }));
    VS.showResult(box, res, { okTitle: 'Order received', okText: 'Online card/UPI checkout is being switched on — we\'ll email you a secure payment link for ' + f.total + ' shortly.', summary: 'Book order\n' + f.items + '\nTotal: ' + f.total + '\nName: ' + f.name + '\nPhone: ' + f.phone, subject: 'Book order', payment: { kind: 'books', amount: t.total, method: 'upi', name: f.name, email: f.email, phone: f.phone } });
    if (res.ok) SHOP.clear();
  }

  SHOP.catalog().then(c => { cat = c; render(); });
  document.addEventListener('vs-cart', () => cat && render());
})();
</script>
</body>
</html>
