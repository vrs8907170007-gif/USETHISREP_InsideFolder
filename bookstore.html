<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookstore — Vishal Singh</title>
<meta name="description" content="Buy books by Vishal Singh (Sanatani V) — The Divine Code, The Complete Science of Numerology, An Autobiography of God, Road to Billions, AI Unlocked, Tsunami, The Cage Keepers. E-book, paperback and hardcover; in India here, worldwide on Amazon.">
<meta name="theme-color" content="#0B0D12">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Vishal Singh">
<meta property="og:title" content="Bookstore — Vishal Singh">
<meta property="og:description" content="E-book, paperback and hardcover — buy here in India or on Amazon worldwide.">
<meta property="og:image" content="https://vsofficial.vercel.app/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@400;600&display=swap">
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="css/base.css">
<style>
  body{ --accent: var(--violet); --accent-glow: var(--violet-glow); }
  .con-hero{ position:relative; overflow:hidden; padding:76px 0 56px; border-bottom:1px solid var(--line); }
  .con-hero .glow{ width:640px; height:640px; background: var(--violet); top:-300px; left:-160px; }
  .con-hero h1{ font-size: clamp(36px,5vw,60px); margin-top:16px; }

  .book-row{ display:grid; grid-template-columns: 160px 1fr; gap:32px; padding:36px 0; border-top:1px solid var(--line); }
  .book-row:first-child{ border-top:none; }
  @media (max-width:640px){ .book-row{ grid-template-columns:1fr; } }
  .book-cover{ aspect-ratio:2/3; border-radius:10px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; text-align:center; font-size:11.5px; color:var(--ivory-dim); padding:12px; }
  .book-row h4{ font-size:21px; }
  .book-row .by{ font-size:12.5px; color:var(--violet); font-weight:700; margin-top:6px; }
  .book-row .feeling{ margin-top:14px; font-size:14.5px; color:var(--ivory-dim); font-style:italic; border-left:2px solid var(--violet); padding-left:14px; }
  .book-actions{ display:flex; gap:14px; margin-top:16px; align-items:center; flex-wrap:wrap; }
  .react-btn{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ivory-dim); border:1px solid var(--line); border-radius:999px; padding:8px 16px; cursor:pointer; }
  .react-btn:hover{ border-color:var(--violet); color:var(--violet); }
  .react-btn.liked{ border-color:var(--violet); background:rgba(122,79,224,0.14); color:var(--violet); }

  .viewpoints{ margin-top:20px; }
  .vp{ display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--line-soft); }
  .vp .avatar{ width:34px; height:34px; border-radius:50%; background:rgba(122,79,224,0.18); color:var(--violet); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0; }
  .vp b{ font-size:13.5px; }
  .vp p{ font-size:13.5px; color:var(--ivory-dim); margin-top:4px; }
  .vp-form{ margin-top:14px; display:flex; gap:10px; }
  .vp-form input{ flex:1; padding:11px 14px; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--ivory); font-size:13.5px; }

  /* Book cover with teaser trigger */
  .book-cover-link{ display:block; position:relative; width:160px; min-width:160px; max-width:160px; aspect-ratio:2/3; border-radius:10px; overflow:hidden; border:1px solid var(--line); cursor:pointer; }
  .book-cover-link img{ display:block; width:100%; height:100%; object-fit:cover; }
  @media (max-width:640px){ .book-cover-link{ width:160px; max-width:160px; } }
  .cover-play-overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background: rgba(11,13,18,0.0); transition: background .25s ease; }
  .book-cover-link:hover .cover-play-overlay{ background: rgba(11,13,18,0.45); }
  .cover-play-btn{ width:46px; height:46px; border-radius:50%; background: rgba(245,241,232,0.92); color: var(--stage); display:flex; align-items:center; justify-content:center; font-size:16px; opacity:0; transform: scale(0.85); transition: all .25s ease; }
  .book-cover-link:hover .cover-play-btn{ opacity:1; transform: scale(1); }
  .cover-teaser-label{ position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--ivory); opacity:0; transition: opacity .25s ease; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
  .book-cover-link:hover .cover-teaser-label{ opacity:1; }

  /* Price + pre-book */
  .price-row{ display:flex; align-items:baseline; gap:10px; margin-top:16px; }
  .price-row .price-tag{ font-family:var(--font-display); font-size:24px; color: var(--gold); font-weight:600; }
  .price-row .price-note{ font-size:12px; color: var(--ivory-dim); }
  .prebook-btn{ display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:12px 22px; border-radius:999px; background: var(--violet); color:#fff; font-size:13.5px; font-weight:700; border:none; cursor:pointer; box-shadow: 0 8px 24px var(--violet-glow); }
  .prebook-btn:hover{ filter:brightness(1.08); }

  /* PiP-style teaser modal */
  .teaser-modal-backdrop{ display:none; position:fixed; inset:0; background: rgba(6,7,10,0.82); z-index:200; align-items:center; justify-content:center; padding:24px; }
  .teaser-modal-backdrop.open{ display:flex; }
  .teaser-modal{ position:relative; width:min(420px, 100%); background: var(--stage-2); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  .teaser-modal video{ width:100%; display:block; background:#000; aspect-ratio:16/9; }
  .teaser-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); }
  .teaser-modal-head span{ font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ivory-dim); }
  .teaser-close{ width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--ivory); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .teaser-close:hover{ border-color:var(--violet); color:var(--violet); }
  .teaser-modal-foot{ padding:14px 18px; font-size:12.5px; color:var(--ivory-dim); }

  /* Pre-book form modal (reuses booking-box look) */
  .booking-box{ border:1px solid var(--line); padding:30px; border-radius:16px; background: linear-gradient(180deg, var(--stage-2), var(--stage-3)); margin-top:24px; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media (max-width:640px){ .form-row{ grid-template-columns:1fr; } }
  .booking-box label{ font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ivory-dim); display:block; margin-bottom:8px; }
  .booking-box input, .booking-box select{ width:100%; padding:13px 15px; border:1px solid var(--line); background: rgba(255,255,255,0.03); border-radius:8px; font-family:var(--font-body); font-size:14.5px; color:var(--ivory); }
  .booking-box input::placeholder{ color: rgba(245,241,232,0.35); }
  .booking-box input:focus, .booking-box select:focus{ outline:2px solid var(--violet); outline-offset:1px; border-color: transparent; }
  .total-row{ display:flex; justify-content:space-between; padding-top:16px; border-top:1px solid var(--line); margin-top:4px; font-size:15px; }
  .confirm-box{ display:none; border:1px solid var(--violet); background: rgba(122,79,224,0.14); border-radius:10px; padding:20px; margin-top:20px; font-size:13.5px; color:var(--violet); }
  .prebook-panel{ display:none; }
  .prebook-panel.open{ display:block; }
  .store-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; }
  .notify-form{ display:flex; gap:10px; margin-top:16px; max-width:420px; }
  .notify-form .vs-input{ flex:1; }
  .notify-form .btn{ padding:12px 20px; font-size:13px; }
  .store-card.flash{ box-shadow:0 0 0 2px var(--violet), 0 20px 60px var(--violet-glow); }
  .store-filters{ display:flex; flex-direction:column; gap:10px; margin-top:26px; }
  .store-filters .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .store-filters .chips button{ background:none; border:1px solid var(--line); color:var(--ivory-dim); font:600 12px var(--font-body); padding:7px 14px; border-radius:999px; cursor:pointer; }
  .store-filters .chips button.on{ background:var(--violet); color:#fff; border-color:var(--violet); }
  .series-block{ margin-top:44px; }
  .series-block h3{ font-size:24px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .series-block h3 small{ font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--ivory-dim); letter-spacing:.04em; }
  .series-block .store-grid{ margin-top:18px; }
  .store-card.soon .sc-cover{ opacity:.78; }
  .soon-badge{ align-self:flex-start; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:999px; border:1px solid var(--gold); color:var(--gold); }
  .out-badge{ align-self:flex-start; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:999px; border:1px solid var(--emerald); color:#8fd9bf; }
  .sc-notify{ display:flex; gap:6px; margin-top:auto; }
  .sc-notify input{ flex:1; min-width:0; padding:10px 12px; font-size:12.5px; }
  .sc-notify .btn{ padding:10px 14px; font-size:12px; }
  .sc-note{ font-size:12px; color:var(--ivory-dim); }
  .sc-also{ font-size:12px; color:var(--ivory-dim); }
  .sc-also a{ color:var(--gold); font-weight:600; }
  .store-card h3, .store-card .sc-sub, .series-block h3{ font-family: var(--font-display), 'Noto Serif Devanagari', serif; }
  .price-row{ flex-wrap:wrap; row-gap:4px; }
  .price-row .price-tag{ white-space:nowrap; }
  .fl-head{ font-size:26px; margin:44px 0 6px; display:flex; align-items:baseline; gap:12px; }
  .fl-head small{ font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--ivory-dim); letter-spacing:.04em; }
  .fl-sub{ font-size:14px; color:var(--ivory-dim); margin-top:4px; font-family:var(--font-display), 'Noto Serif Devanagari', serif; }
  .fl-blurb{ margin-top:14px; font-size:14.5px; color:var(--ivory-dim); line-height:1.7; max-width:68ch; }
  .book-row h4{ font-family: var(--font-display), 'Noto Serif Devanagari', serif; }
  .book-cover-link.static{ cursor:default; }
  .book-cover-link .type-cover{ width:100%; }
  .book-cover-link img{ width:100%; aspect-ratio:1600/2560; object-fit:cover; }
</style>
</head>
<body>
<section class="con-hero">
  <div class="glow"></div>
  <div class="shell">
    <div class="eyebrow reveal">Bookstore</div>
    <h1 class="reveal">Buy the books</h1>
    <p class="reveal" style="max-width:62ch; margin-top:16px; color:var(--ivory-dim); font-size:16.5px;">E-book, paperback or hardcover — available now on Amazon. Buying directly on this website opens soon. Want to know a book first? Read about it and watch teasers on the <a href="contribution.html" style="color:var(--violet); font-weight:600;">Contribution</a> page.</p>
  </div>
</section>

<section class="section" id="store" style="padding-top:56px;">
  <div class="shell">
    <div class="store-head">
      <div>
        <h2 class="reveal" style="font-size:clamp(26px,3.4vw,36px);">All books</h2>
        <p class="reveal" id="storeIntro" style="max-width:62ch; margin-top:10px; color:var(--ivory-dim);"></p>
      </div>
      <div class="region-toggle reveal" role="group" aria-label="Where are you buying from?">
        <button type="button" data-region="IN">India · ₹</button>
        <button type="button" data-region="INTL">Outside India · $</button>
      </div>
    </div>
    <div class="store-filters reveal">
      <div class="chips" id="availChips" role="group" aria-label="Show">
        <button type="button" data-a="all" class="on">All books</button>
        <button type="button" data-a="sale">Out now</button>
        <button type="button" data-a="soon">Coming soon</button>
      </div>
      <div class="chips" id="seriesChips" role="group" aria-label="Series"></div>
    </div>
    <div id="storeGrid" aria-live="polite"><p style="color:var(--ivory-dim); margin-top:30px;">Loading books…</p></div>
  </div>
</section>

<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/catalog-data.js"></script>
<script src="js/shop.js"></script>
<script src="js/shell.js"></script>
<script>
(function(){
  const grid = document.getElementById('storeGrid'), esc = SHOP.esc;
  let cat, avail = 'all', series = 'all';
  const amz = (b, k) => (b.amazon || {})[k === 'ebook' ? 'kindle' : k === 'print' ? 'paperback' : 'hardcover'] || '';
  function fmtRow(b, key, f, checked){
    return `<label class="fmt-opt${checked ? ' sel' : ''}"><span><input type="radio" name="fmt-${b.id}" value="${key}"${checked ? ' checked' : ''}>${esc(f.label)}</span><b>${SHOP.inr(f.price.INR)}</b></label>`;
  }
  function card(b, region){
    const firstFmt = region === 'IN' ? (Object.entries(b.formats).find(([k, f]) => f.status !== 'off') || [])[0] : 'ebook';
    const head = `<div class="sc-cover-wrap">${SHOP.cover(b, 'sc-cover', firstFmt)}</div><h3>${esc(b.title)}</h3>${b.subtitle ? `<div class="sc-sub">${esc(b.subtitle)}</div>` : ''}`;
    if (b.status !== 'sale') {
      return `<article class="store-card soon" id="book-${b.id}" data-id="${b.id}">${head}<span class="soon-badge">Coming soon</span>
        <form class="sc-notify" novalidate><input class="vs-input" type="email" placeholder="Email me at launch" aria-label="Email me when ${esc(b.title)} launches" autocomplete="email"><button class="btn btn-accent" type="submit">Notify me</button></form></article>`;
    }
    const fm = Object.entries(b.formats).filter(([k, f]) => f.status !== 'off');
    let body;
    if (region === 'IN' && !cat.shopOpen) {
      const row = (k, label, host) => { const f = b.formats[k]; if (!f) return ''; let url = amz(b, k); if (url && host) url = url.replace('www.amazon.com', host);
        return `<a class="amz-btn${url ? '' : ' off'}" data-fmt="${k}" ${url ? `href="${esc(url)}" target="_blank" rel="noopener"` : 'aria-disabled="true"'}>${label} <span>→</span></a>`; };
      body = `<div class="fmt-opts">${row('ebook', 'Kindle on Amazon.in', 'www.amazon.in')}${row('print', 'Paperback on Amazon')}${row('hardcover', 'Hardcover on Amazon')}</div><div class="sc-note">Buying on this website opens soon.</div>`;
    } else if (region === 'IN') {
      const kindle = amz(b, 'ebook');
      body = `<div class="fmt-opts">${fm.map(([k, f], i) => fmtRow(b, k, f, i === 0)).join('')}</div>
        <div class="sc-actions"><button class="btn" type="button" data-add>Add to cart</button><button class="btn btn-accent" type="button" data-buy>Buy now</button></div>
        ${kindle ? `<div class="sc-also">Prefer Kindle? <a href="${esc(kindle.replace('www.amazon.com', 'www.amazon.in'))}" target="_blank" rel="noopener">View on Amazon.in →</a></div>` : ''}`;
    } else {
      const row = (k, label) => { const f = b.formats[k]; if (!f) return ''; const url = amz(b, k);
        return `<a class="amz-btn${url ? '' : ' off'}" data-fmt="${k}" ${url ? `href="${esc(url)}" target="_blank" rel="noopener"` : 'aria-disabled="true"'}>${label} on Amazon <span>${SHOP.usd(f.price.USD)}</span></a>`; };
      body = `<div class="fmt-opts">${row('ebook', 'Kindle')}${row('print', 'Paperback')}${row('hardcover', 'Hardcover')}</div>`;
    }
    return `<article class="store-card" id="book-${b.id}" data-id="${b.id}">${head}<span class="out-badge">Out now</span>${body}</article>`;
  }
  function render(){
    const region = SHOP.region();
    document.querySelectorAll('.region-toggle button').forEach(x => x.classList.toggle('on', x.dataset.region === region));
    const nSale = cat.books.filter(b => b.status === 'sale').length, nSoon = cat.books.filter(b => b.status === 'soon').length;
    document.getElementById('storeIntro').textContent = region === 'IN' && !cat.shopOpen
      ? `${nSale} books out now on Amazon, ${nSoon} more on the way. Buying e-books, paperbacks and hardcovers directly on this website opens soon — until then, buy on Amazon.`
      : region === 'IN'
      ? `${nSale} books out now, ${nSoon} more on the way. Pay securely here by UPI, card or net banking — paperbacks and hardcovers ship anywhere in India (free above ₹${Number(cat.shipping.freeAbove).toLocaleString('en-IN')}) — or buy on Amazon.`
      : `${nSale} books out now on Amazon — Kindle, paperback and hardcover, at Amazon's prices in US dollars. ${nSoon} more on the way.`;
    const books = cat.books.filter(b => (avail === 'all' || b.status === avail) && (series === 'all' || b.series === series));
    const groups = cat.series.map(s => ({ s, list: books.filter(b => b.series === s.id).sort((x, y) => (x.status === 'sale' ? 0 : 1) - (y.status === 'sale' ? 0 : 1)) })).filter(g => g.list.length);
    grid.innerHTML = groups.length ? groups.map(g => `<div class="series-block"><h3>${esc(g.s.name)} <small>${g.list.filter(b => b.status === 'sale').length ? g.list.filter(b => b.status === 'sale').length + ' out now' : ''}${g.list.filter(b => b.status === 'sale').length && g.list.filter(b => b.status !== 'sale').length ? ' · ' : ''}${g.list.filter(b => b.status !== 'sale').length ? g.list.filter(b => b.status !== 'sale').length + ' coming soon' : ''}</small></h3>
      <div class="store-grid">${g.list.map(b => card(b, region)).join('')}</div></div>`).join('') : '<p style="color:var(--ivory-dim); margin-top:30px;">No books match this filter.</p>';
    if (location.hash.startsWith('#book-')) { const el = document.getElementById(location.hash.slice(1)); if (el) { el.classList.add('flash'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => el.classList.remove('flash'), 2200); } }
  }
  function chips(){
    document.getElementById('seriesChips').innerHTML = `<button type="button" data-s="all" class="on">All series</button>` + cat.series.filter(s => cat.books.some(b => b.series === s.id)).map(s => `<button type="button" data-s="${s.id}">${esc(s.name)}</button>`).join('');
  }
  document.getElementById('availChips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; avail = b.dataset.a; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); });
  document.getElementById('seriesChips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; series = b.dataset.s; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); });
  grid.addEventListener('change', e => { const opt = e.target.closest('.fmt-opt'); if (!opt) return; opt.parentElement.querySelectorAll('.fmt-opt').forEach(o => o.classList.toggle('sel', o === opt));
    const c = opt.closest('.store-card'), bk = SHOP.book(cat, c.dataset.id), fmt = opt.querySelector('input').value; c.querySelector('.sc-cover-wrap').innerHTML = SHOP.cover(bk, 'sc-cover', fmt); });
  grid.addEventListener('click', e => {
    const btn = e.target.closest('[data-add],[data-buy]'); if (!btn) return;
    const c = btn.closest('.store-card'); const fmt = (c.querySelector('input[type=radio]:checked') || {}).value; if (!fmt) return;
    SHOP.add(c.dataset.id, fmt, 1);
    if (btn.hasAttribute('data-buy')) { location.href = 'checkout.html'; return; }
    VS.toast('Added to cart — ' + SHOP.book(cat, c.dataset.id).title);
  });
  grid.addEventListener('submit', async e => {
    const f = e.target.closest('.sc-notify'); if (!f) return; e.preventDefault();
    const input = f.querySelector('input'), btn = f.querySelector('button'), b = SHOP.book(cat, f.closest('.store-card').dataset.id);
    const err = VS.validate([{ el: input, req: true, type: 'email', label: 'Email' }]); if (err) { VS.toast(err); return; }
    const res = await VS.busy(btn, '…', () => VS.submitRequest('contact', { email: input.value.trim(), reason: 'Notify me at launch', book: b.title }, { prefix: 'NTF', subject: 'Launch alert sign-up — ' + b.title }));
    if (res.ok) { f.outerHTML = `<p class="sc-note">✓ We'll email you the day it launches.</p>`; } else VS.toast("Couldn't save that — please try again");
  });
  document.querySelectorAll('.region-toggle button').forEach(b => b.addEventListener('click', () => { SHOP.setRegion(b.dataset.region); render(); }));
  // abroad: show the matching format's cover while hovering its Amazon button
  grid.addEventListener('mouseover', e => { const a = e.target.closest('.amz-btn[data-fmt]'); if (!a) return; const c = a.closest('.store-card'), bk = SHOP.book(cat, c.dataset.id); const w = c.querySelector('.sc-cover-wrap'); const next = SHOP.coverSrc(bk, a.dataset.fmt); const img = w.querySelector('img'); if (next && img && img.getAttribute('src') !== next) w.innerHTML = SHOP.cover(bk, 'sc-cover', a.dataset.fmt); });
  window.addEventListener('hashchange', () => cat && render());
  SHOP.catalog().then(c => { cat = c; chips(); render(); }).catch(() => { grid.innerHTML = '<p style="color:var(--ivory-dim);">The bookstore couldn\'t load. Please refresh the page.</p>'; });

  // "Notify me" for coming-soon books
  document.querySelectorAll('.notify-form').forEach(f => f.addEventListener('submit', async e => {
    e.preventDefault();
    const input = f.querySelector('input'), box = f.nextElementSibling, btn = f.querySelector('button');
    const err = VS.validate([{ el: input, req: true, type: 'email', label: 'Email' }]);
    if (err) { box.style.display = 'block'; box.className = 'notice err'; box.textContent = err; return; }
    const res = await VS.busy(btn, 'Saving…', () => VS.submitRequest('contact', { email: input.value.trim(), reason: 'Notify me at launch', book: f.dataset.book }, { prefix: 'NTF', subject: 'Launch alert sign-up — ' + f.dataset.book }));
    box.style.display = 'block'; box.className = 'notice ' + (res.ok ? 'ok' : 'err');
    box.textContent = res.ok ? "✓ You're on the list — we'll email you the day " + f.dataset.book + ' launches.' : "Couldn't save that just now — please try again.";
    if (res.ok) input.value = '';
  }));
})();
</script>
</body>
</html>
